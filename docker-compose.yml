# Chay: npm run db:up   (hoac: docker compose up -d mysql)
# Bien ${...} doc tu file .env o thu muc goc (copy tu .env.example)
services:
  mysql:
    image: mysql:8.4
    container_name: scms-mysql
    restart: unless-stopped
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-scms}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-scms_root}
      TZ: Asia/Ho_Chi_Minh
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - scms_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-uroot',
          '-p${MYSQL_ROOT_PASSWORD:-scms_root}',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  scms_mysql_data:
