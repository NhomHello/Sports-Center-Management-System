<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:672px;height:1285px;background:#FFFFFF;" width="672px" height="1285px" viewBox="0 0 672 1285" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="20"><text x="20" y="40.421" fill="#000" font-size="22" textLength="630.158" font-weight="700" font-family="DejaVu Sans">One continuous demo - four happy-path workflows</text></g><ellipse cx="335.796" cy="71.609" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="173.819" y="91.609" width="323.953" height="161.844" fill="none" style="stroke:#000;stroke-width:1.5;"/><path d="M477.755,91.609 L477.755,102.07 L467.755,112.07 L173.819,112.07" style="stroke:#000;stroke-width:1.5;" fill="none"/><text x="176.819" y="106.533" fill="#000" font-size="15" textLength="293.936" font-family="DejaVu Sans">WF1 - Course and member preparation</text><rect x="268.22" y="129.07" width="135.151" height="37.461" fill="#F0F5F9" style="stroke:#25465E;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="278.22" y="152.994" fill="#000" font-size="15" textLength="115.151" font-family="DejaVu Sans">Course A ready</text><rect x="183.819" y="186.531" width="303.953" height="54.922" fill="#F0F5F9" style="stroke:#25465E;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="193.819" y="210.455" fill="#000" font-size="15" textLength="283.953" font-family="DejaVu Sans">Member M profile and shared training</text><text x="291.982" y="227.916" fill="#000" font-size="15" textLength="87.627" font-family="DejaVu Sans">goals ready</text><rect x="173.979" y="264.491" width="323.633" height="386.609" fill="none" style="stroke:#000;stroke-width:1.5;"/><path d="M487.612,264.491 L487.612,274.952 L477.612,284.952 L173.979,284.952" style="stroke:#000;stroke-width:1.5;" fill="none"/><text x="176.979" y="279.414" fill="#000" font-size="15" textLength="303.633" font-family="DejaVu Sans">WF2 - Purchase and successful payment</text><rect x="205.668" y="301.952" width="260.256" height="54.922" fill="#F0F5F9" style="stroke:#25465E;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="215.668" y="325.875" fill="#000" font-size="15" textLength="240.256" font-family="DejaVu Sans">Member M creates invoice I and</text><text x="266.377" y="343.336" fill="#000" font-size="15" textLength="138.838" font-family="DejaVu Sans">displays code / QR</text><rect x="194.725" y="376.874" width="282.141" height="37.461" fill="#F0F5F9" style="stroke:#25465E;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="204.725" y="400.797" fill="#000" font-size="15" textLength="262.141" font-family="DejaVu Sans">Invoice I is PAID; M is BOOKED in A</text><rect x="187.595" y="434.334" width="296.401" height="54.922" fill="#F0F5F9" style="stroke:#25465E;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="197.595" y="458.258" fill="#000" font-size="15" textLength="276.401" font-family="DejaVu Sans">Receptionist opens the same invoice</text><text x="293.081" y="475.719" fill="#000" font-size="15" textLength="85.43" font-family="DejaVu Sans">and receipt</text><rect x="193.297" y="509.256" width="284.998" height="54.922" fill="#F0F5F9" style="stroke:#25465E;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="222.27" y="533.18" fill="#000" font-size="15" textLength="227.051" font-family="DejaVu Sans">Member transfers the whole A</text><text x="203.297" y="550.641" fill="#000" font-size="15" textLength="264.998" font-family="DejaVu Sans">enrollment to equivalent course A2</text><rect x="207.063" y="584.178" width="257.466" height="54.922" fill="#F0F5F9" style="stroke:#25465E;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="217.063" y="608.102" fill="#000" font-size="15" textLength="237.466" font-family="DejaVu Sans">A enrollment is CANCELLED; A2</text><text x="251.831" y="625.563" fill="#000" font-size="15" textLength="167.93" font-family="DejaVu Sans">enrollment is BOOKED</text><rect x="168.275" y="661.1" width="335.042" height="196.766" fill="none" style="stroke:#000;stroke-width:1.5;"/><path d="M362.054,661.1 L362.054,671.561 L352.054,681.561 L168.275,681.561" style="stroke:#000;stroke-width:1.5;" fill="none"/><text x="171.275" y="676.023" fill="#000" font-size="15" textLength="183.779" font-family="DejaVu Sans">WF3 - Learning progress</text><rect x="183.721" y="698.561" width="304.15" height="72.383" fill="#F0F5F9" style="stroke:#25465E;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="193.721" y="722.484" fill="#000" font-size="15" textLength="284.15" font-family="DejaVu Sans">Assigned coach records PRESENT and</text><text x="202.272" y="739.945" fill="#000" font-size="15" textLength="267.048" font-family="DejaVu Sans">feedback in B within the authorized</text><text x="262.264" y="757.406" fill="#000" font-size="15" textLength="147.063" font-family="DejaVu Sans">attendance window</text><rect x="178.275" y="790.944" width="315.042" height="54.922" fill="#F0F5F9" style="stroke:#25465E;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="188.275" y="814.867" fill="#000" font-size="15" textLength="295.042" font-family="DejaVu Sans">Member M reads the saved attendance</text><text x="284.849" y="832.328" fill="#000" font-size="15" textLength="101.895" font-family="DejaVu Sans">and feedback</text><rect x="152.842" y="868.903" width="362.475" height="254.227" fill="none" style="stroke:#000;stroke-width:1.5;"/><path d="M508.75,868.903 L508.75,879.364 L498.75,889.364 L152.842,889.364" style="stroke:#000;stroke-width:1.5;" fill="none"/><text x="155.842" y="883.827" fill="#000" font-size="15" textLength="345.908" font-family="DejaVu Sans">WF4 - Results, rating and management report</text><rect x="186.914" y="906.364" width="297.764" height="54.922" fill="#F0F5F9" style="stroke:#25465E;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="196.914" y="930.288" fill="#000" font-size="15" t