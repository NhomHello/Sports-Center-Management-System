u Sans">Return previous result</text><text x="216.143" y="335.605" fill="#000" font-size="15" textLength="168.757" font-family="DejaVu Sans">without adding money</text><ellipse cx="300.522" cy="380.143" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="300.522" cy="380.143" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="300.522,243.491,312.522,255.491,300.522,267.491,288.522,255.491,300.522,243.491" fill="#F0F5F9" style="stroke:#25465E;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="306.522" y="239.953" fill="#000" font-size="15" textLength="146.865" font-family="DejaVu Sans">Already processed?</text><text x="306.522" y="281.414" fill="#000" font-size="15" textLength="26.206" font-family="DejaVu Sans">Yes</text><rect x="159.887" y="433.143" width="281.27" height="54.922" fill="#F0F5F9" style="stroke:#25465E;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="169.887" y="457.066" fill="#000" font-size="15" textLength="68.481" font-weight="700" font-family="DejaVu Sans">System:</text><text x="243.137" y="457.066" fill="#000" font-size="15" textLength="188.02" font-family="DejaVu Sans">Lock invoice; check bank</text><text x="191.692" y="474.527" fill="#000" font-size="15" textLength="217.661" font-family="DejaVu Sans">time, seat hold and schedule</text><polygon points="300.522,517.563,312.522,529.563,300.522,541.563,288.522,529.563,300.522,517.563" fill="#F0F5F9" style="stroke:#25465E;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="306.522" y="514.026" fill="#000" font-size="15" textLength="226.846" font-family="DejaVu Sans">Transfer valid for this invoice?</text><text x="262.316" y="526.026" fill="#000" font-size="15" textLength="26.206" font-family="DejaVu Sans">Yes</text><text x="312.522" y="526.026" fill="#000" font-size="15" textLength="20.398" font-family="DejaVu Sans">No</text><rect x="16" y="551.563" width="282.28" height="54.922" fill="#F0F5F9" style="stro